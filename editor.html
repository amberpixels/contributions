<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>contributions: pattern editor</title>
<style>
  :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --panel: #161b22; --border: #30363d; }
  body.light { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --panel: #f6f8fa; --border: #d1d9e0; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
         font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.hint { color: var(--muted); margin: 0 0 16px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  button, select, input { background: var(--panel); color: var(--fg); border: 1px solid var(--border);
         border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  input[type=number] { width: 56px; cursor: text; }
  .swatch { width: 26px; height: 26px; padding: 0; border-radius: 6px; }
  .swatch.on { outline: 2px solid var(--fg); outline-offset: 2px; }
  #wrap { overflow-x: auto; padding: 14px; border: 1px solid var(--border); border-radius: 6px; display: inline-block; max-width: 100%; }
  #grid { display: grid; gap: 3px; user-select: none; }
  .cell { width: 12px; height: 12px; border-radius: 2px; cursor: crosshair; box-sizing: border-box; }
  .cell.guide { box-shadow: inset 2px 0 0 #f0883e; }
  .stats { color: var(--muted); margin: 10px 0 18px; }
  textarea { width: 100%; max-width: 760px; height: 150px; background: var(--panel); color: var(--fg);
         border: 1px solid var(--border); border-radius: 6px; padding: 8px; box-sizing: border-box;
         font: 13px/1.15 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
  label { color: var(--muted); }
</style>
</head>
<body>
<h1>Pattern editor</h1>
<p class="hint">Click or drag to paint, right-click to erase. Keys 0-4 pick a shade.
  Rows are Sunday to Saturday, one column per week. The text below is the <code>art/*.txt</code> format.</p>

<div class="bar">
  <span id="swatches"></span>
  <label>columns <input id="cols" type="number" min="1" max="60" value="53"></label>
  <label>guide at <input id="guide" type="number" min="0" max="60" value="40"></label>
  <button id="left">◀ shift</button>
  <button id="right">shift ▶</button>
  <button id="clear">clear</button>
  <button id="reset">reset to file pattern</button>
  <button id="theme">light / dark</button>
</div>

<div id="wrap"><div id="grid"></div></div>
<div class="stats" id="stats"></div>

<div class="bar">
  <button id="copy">copy text</button>
  <button id="load">load text into grid</button>
  <span class="hint" id="msg"></span>
</div>
<textarea id="text" spellcheck="false"></textarea>

<script>
const ROWS = 7;
const CHARS = [" ", "░", "▒", "▓", "█"];
const PALETTE = {
  dark:  ["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"],
  light: ["#ebedf0", "#9be9a8", "#40c463", "#30a14e", "#216e39"],
};
// Current art/who-cares.txt, so the editor opens on the live pattern.
const START = [
  "█   █ █  █  ██     ███ ██  ███  ████ ███",
  "█   █ █  █ █  █   █   █  █ █  █ █   █",
  "█   █ █  █ █  █   █   █  █ █  █ █   █",
  "█ █ █ ████ █  █   █   ████ ███  ███  ██",
  "█ █ █ █  █ █  █   █   █  █ █ █  █      █",
  "██ ██ █  █ █  █   █   █  █ █  █ █      █",
  "█   █ █  █  ██     ███   █ █  █ ████ ██",
].join("\n");

let cols = 53, shade = 4, theme = "dark", painting = null;
let cells = Array.from({ length: ROWS }, () => Array(cols).fill(0));

const $ = (id) => document.getElementById(id);

function resize(n) {
  cols = n;
  cells = cells.map((row) => Array.from({ length: n }, (_, c) => row[c] || 0));
}

function render() {
  const grid = $("grid");
  grid.style.gridTemplateColumns = `repeat(${cols}, 12px)`;
  grid.innerHTML = "";
  const guide = +$("guide").value;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < cols; c++) {
      const el = document.createElement("div");
      el.className = "cell" + (guide > 0 && c === guide ? " guide" : "");
      el.style.background = PALETTE[theme][cells[r][c]];
      el.dataset.r = r; el.dataset.c = c;
      grid.appendChild(el);
    }
  }
  $("swatches").innerHTML = "";
  PALETTE[theme].forEach((color, i) => {
    const b = document.createElement("button");
    b.className = "swatch" + (i === shade ? " on" : "");
    b.style.background = color;
    b.title = i === 0 ? "empty (0)" : `shade ${i}`;
    b.onclick = () => { shade = i; render(); };
    $("swatches").appendChild(b);
  });
  sync();
}

function used() {
  let first = -1, last = -1;
  for (let c = 0; c < cols; c++) {
    if (cells.some((row) => row[c] > 0)) { if (first < 0) first = c; last = c; }
  }
  return first < 0 ? null : [first, last];
}

// The drawing survives reloads; "reset to file pattern" brings START back.
const STORE = "contributions-editor";

function sync() {
  const span = used();
  localStorage.setItem(STORE, JSON.stringify({ cols, cells }));
  if (!span) { $("text").value = ""; $("stats").textContent = "empty"; return; }
  const [first, last] = span;
  $("text").value = cells
    .map((row) => row.slice(first, last + 1).map((v) => CHARS[v]).join("").replace(/\s+$/, ""))
    .join("\n") + "\n";
  const lit = cells.flat().filter((v) => v > 0).length;
  $("stats").textContent =
    `pattern width ${last - first + 1} columns (cols ${first + 1}-${last + 1}), ${lit} lit cells`;
}

function paint(el, value) {
  const r = +el.dataset.r, c = +el.dataset.c;
  if (cells[r][c] === value) return;
  cells[r][c] = value;
  el.style.background = PALETTE[theme][value];
  sync();
}

function load(text) {
  const lines = text.replace(/\n$/, "").split("\n");
  if (lines.length !== ROWS) { $("msg").textContent = `need exactly ${ROWS} rows, got ${lines.length}`; return; }
  const map = { " ": 0, ".": 0, "0": 0, "1": 1, "░": 1, "2": 2, "▒": 2, "3": 3, "▓": 3, "4": 4, "█": 4, "#": 4 };
  const parsed = [];
  for (const line of lines) {
    const row = [];
    for (const ch of line) {
      if (!(ch in map)) { $("msg").textContent = `unknown character "${ch}"`; return; }
      row.push(map[ch]);
    }
    parsed.push(row);
  }
  const width = Math.max(...parsed.map((r) => r.length));
  resize(Math.max(cols, width));
  cells = parsed.map((row) => Array.from({ length: cols }, (_, c) => row[c] || 0));
  $("msg").textContent = "";
  render();
}

$("grid").addEventListener("mousedown", (e) => {
  if (!e.target.dataset.r) return;
  painting = e.button === 2 ? 0 : shade;
  paint(e.target, painting);
});
$("grid").addEventListener("mouseover", (e) => {
  if (painting !== null && e.target.dataset.r) paint(e.target, painting);
});
$("grid").addEventListener("contextmenu", (e) => e.preventDefault());
window.addEventListener("mouseup", () => { painting = null; });
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key >= "0" && e.key <= "4") { shade = +e.key; render(); }
});

$("cols").onchange = (e) => { resize(Math.max(1, +e.target.value)); render(); };
$("guide").onchange = render;
$("left").onclick = () => { cells = cells.map((row) => [...row.slice(1), 0]); render(); };
$("right").onclick = () => { cells = cells.map((row) => [0, ...row.slice(0, -1)]); render(); };
$("clear").onclick = () => { cells = cells.map((row) => row.map(() => 0)); render(); };
$("theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; document.body.classList.toggle("light"); render(); };
$("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText($("text").value);
    $("msg").textContent = "copied, paste into art/<name>.txt";
  } catch {
    // Some browsers block the clipboard API on file:// pages.
    $("text").select();
    $("msg").textContent = "clipboard blocked here: text is selected, press Cmd+C";
  }
};
$("load").onclick = () => load($("text").value);

$("reset").onclick = () => load(START);

const saved = JSON.parse(localStorage.getItem(STORE) || "null");
if (saved && saved.cells && saved.cells.length === ROWS) {
  cols = saved.cols; cells = saved.cells; $("cols").value = cols; render();
} else {
  load(START);
}
</script>
</body>
</html>
